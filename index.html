<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Thu 3D - Vũ Trụ Đêm Rằm</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="assets/css.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #060312;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .top-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }
        .control-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #ffd700;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .control-btn:hover {
            background: #ffd700;
            color: #060312;
            box-shadow: 0 0 20px #ffd700;
        }
        .brand-title {
            position: absolute;
            bottom: 40px;
            left: 40px;
            color: #ffffff;
            z-index: 5;
            pointer-events: none;
        }
        .brand-title h1 {
            font-size: 48px;
            margin: 0 0 5px 0;
        }
        .brand-title p {
            font-size: 18px;
            margin: 0;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="brand-title">
        <h1>Trung thu</h1>
        <p>Tết trung thu đoàn viên</p>
    </div>

    <div class="top-bar">
        <button class="control-btn" id="audio-btn"><i class="fas fa-music"></i> Bật Nhạc</button>
    </div>

    <div id="webgl-container"></div>

    <div class="wish-modal" id="wishModal">
        <div class="wish-card">
            <button class="close-btn" id="closeWishBtn">&times;</button>
            <div class="card-body">
                <img src="" id="wishImage" alt="Hình ảnh Trung Thu">
                <p id="wishText"></p>
            </div>
        </div>
    </div>

    <audio id="bgm" src="assets/1.mp3" loop></audio>

    <!-- ĐƯỜNG DẪN GỌI FILE THƯ VIỆN GỐC CHUẨN XÁC -->
    <script src="assets/three.min.js"></script>
    <script src="assets/OrbitControls.js"></script>
    <script src="assets/script.js"></script>

</body>
</html>
