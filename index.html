<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Thu 3D - Vũ Trụ Đêm Rằm</title>
    <!-- Khai báo thư viện giao diện nút bấm và hiệu ứng font chữ nền -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="assets/css.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #060312;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Giao diện thanh công cụ cố định góc trên */
        .top-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            gap: 15px;
        }
        .control-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #ffd700;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
        }
        .control-btn:hover {
            background: #ffd700;
            color: #060312;
            box-shadow: 0 0 20px #ffd700;
        }
        /* Khung hiển thị chữ Tiêu đề góc trái */
        .brand-title {
            position: absolute;
            bottom: 40px;
            left: 40px;
            color: #ffffff;
            z-index: 5;
            pointer-events: none;
        }
        .brand-title h1 {
            font-size: 48px;
            margin: 0 0 5px 0;
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
        }
        .brand-title p {
            font-size: 18px;
            margin: 0;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <!-- Thanh tiêu đề chữ góc màn hình -->
    <div class="brand-title">
        <h1>Trung thu</h1>
        <p>Tết trung thu đoàn viên</p>
    </div>

    <!-- Thanh công cụ góc trên chứa nút tương tác nhạc -->
    <div class="top-bar">
        <button class="control-btn" id="audio-btn">
            <i class="fas fa-music"></i> Bật Nhạc
        </button>
    </div>

    <!-- Vùng hiển thị không gian Đảo bay đồ họa 3D -->
    <div id="webgl-container"></div>

    <!-- Hộp thoại Modal hiện thiệp chúc mừng kèm ảnh nền khi click lồng đèn -->
    <div class="wish-modal" id="wishModal">
        <div class="wish-card">
            <button class="close-btn" id="closeWishBtn">&times;</button>
            <div class="card-header">Gửi người thương</div>
            <div class="card-body">
                <img src="" id="wishImage" alt="Hình ảnh Trung Thu">
                <p id="wishText"></p>
            </div>
            <div class="card-footer">★ TRUNG THU AN LÀNH ★</div>
        </div>
    </div>

    <!-- Gọi file âm thanh nền hệ thống -->
    <audio id="bgm" src="assets/1.mp3" loop></audio>

    <!-- KÍCH HOẠT HỆ THỐNG THƯ VIỆN ĐỒ HỌA 3D CHUẨN XÁC -->
    <!-- Thư viện cốt lõi Three.js -->
    <script src="assets/three.min.js"></script>
    <!-- Thư viện bổ trợ OrbitControls điều khiển xoay camera -->
    <script src="assets/OrbitControls.js"></script>
    <!-- File xử lý logic thỏ ngọc, hiệu ứng pháo hoa, rải đá và lồng đèn của bạn -->
    <script src="assets/script.js"></script>

</body>
</html>
