<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Thu 3D - Vũ Trụ Đêm Rằm</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #060312;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .top-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }
        .control-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #ffd700;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .control-btn:hover {
            background: #ffd700;
            color: #060312;
            box-shadow: 0 0 20px #ffd700;
        }
        .brand-title {
            position: absolute;
            bottom: 40px;
            left: 40px;
            color: #ffffff;
            z-index: 5;
            pointer-events: none;
        }
        .brand-title h1 {
            font-size: 48px;
            margin: 0 0 5px 0;
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
        }
        .brand-title p {
            font-size: 18px;
            margin: 0;
            opacity: 0.7;
        }
        .wish-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .wish-modal.active { display: flex; }
        .wish-card {
            width: 90%;
            max-width: 320px;
            background: #150f2e;
            border: 2px solid #ffd700;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: white;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: #ffd700;
            font-size: 24px;
            cursor: pointer;
        }
        .card-body img {
            width: 100% !important;
            max-width: 180px !important;
            height: auto !important;
            border-radius: 8px;
            margin: 0 auto 15px auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="brand-title">
        <h1>Trung thu</h1>
        <p>Tết trung thu đoàn viên</p>
    </div>

    <div class="top-bar">
        <button class="control-btn" id="audio-btn"><i class="fas fa-music"></i> Bật Nhạc</button>
    </div>

    <div id="webgl-container"></div>

    <div class="wish-modal" id="wishModal">
        <div class="wish-card">
            <button class="close-btn" id="closeWishBtn">&times;</button>
            <div class="card-body">
                <img src="" id="wishImage" alt="Hình ảnh Trung Thu">
                <p id="wishText"></p>
            </div>
        </div>
    </div>

    <audio id="bgm" src="assets/1.mp3" loop></audio>

    <!-- Các thư viện đồ họa chạy trực tuyến -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    
    <script>
        const container = document.getElementById("webgl-container");
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x060312, 0.001);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        const DEFAULT_CAM_POS = isMobile ? new THREE.Vector3(0, 16, 50) : new THREE.Vector3(0, 22, 45);
        camera.position.copy(DEFAULT_CAM_POS);

        const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 8, 0);
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        // Ánh sáng rực rỡ
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.6); 
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(100, 150, 50);
        scene.add(dirLight);

        // SIÊU MẶT TRĂNG VÀNG SÁNG RỰC RỠ KHÔNG BỊ MỜ CHE KHUẤT
        const moonGeometry = new THREE.SphereGeometry(32, 32, 32);
        const moonMaterial = new THREE.MeshBasicMaterial({ color: 0xfff3a8, transparent: true, opacity: 1.0 });
        const moon = new THREE.Mesh(moonGeometry, moonMaterial);
        moon.position.set(90, 70, -200);
        scene.add(moon);

        // LỜI CHÚC TRUNG THU
        const wishList = [
          { wish: "Cầu chúc cho mọi nguyện ước của người thương đêm nay sẽ trở thành hiện thực.", imgUrl: "./assets/1.jpg" },
          { wish: "Chúc người thương và gia đình một mùa Trung Thu đoàn viên, tràn ngập niềm vui và hạnh phúc!", imgUrl: "./assets/2.jpg" },
          { wish: "Trăng tròn ấm áp, chúc tình cảm của chúng ta mãi luôn bền chặt và ngọt ngào.", imgUrl: "./assets/3.jpg" },
          { wish: "Chúc người thương luôn giữ được sự hồn nhiên, yêu đời và rạng rỡ như ánh trăng rằm.", imgUrl: "./assets/1.jpg" }
        ];

        // MÔ HÌNH ĐẢO BAY 3D
        const islandGroup = new THREE.Group();
        scene.add(islandGroup);

        const islandGeo = new THREE.CylinderGeometry(20, 14, 8, 8, 1);
        const islandMat = new THREE.MeshStandardMaterial({ color: 0x251a4a, roughness: 0.8 });
        const island = new THREE.Mesh(islandGeo, islandMat);
        island.position.y = -4;
        islandGroup.add(island);

        const grassGeo = new THREE.CylinderGeometry(20.2, 20.2, 0.5, 16);
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x3d2563, roughness: 0.6 });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.position.y = 0.25;
        islandGroup.add(grass);

        // ĐOM ĐÓM BAY TRÔI
        const particleCount = isMobile ? 40 : 120;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const speeds = [];

        for(let i=0; i<particleCount; i++) {
            positions[i*3] = (Math.random() - 0.5) * 80;
            positions[i*3+1] = Math.random() * 40 - 5;
            positions[i*3+2] = (Math.random() - 0.5) * 80;
            speeds.push({ x: (Math.random() - 0.5) * 0.05, y: Math.random() * 0.03 + 0.01, z: (Math.random() - 0.5) * 0.05 });
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const fireflies = new THREE.Points(particleGeo, new THREE.PointsMaterial({ color: 0xffd700, size: isMobile ? 0.6 : 0.4, transparent: true, opacity: 0.8 }));
        scene.add(fireflies);

        // LỒNG ĐÈN THẢ LÊN TRỜI
        const lanterns = [];
        const lanternCount = isMobile ? 15 : 35;

        function createLantern(isInitial = false) {
            const lanternGroup = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 3, 8), new THREE.MeshBasicMaterial({ color: 0xff5533 }));
            lanternGroup.add(body);
            
            const capTop = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 0.3, 8), new THREE.MeshBasicMaterial({ color: 0xddaa33 }));
            capTop.position.y = 1.6;
            const capBottom = capTop.clone();
            capBottom.position.y = -1.6;
            lanternGroup.add(capTop, capBottom);
            
            const randomWish = wishList[Math.floor(Math.random() * wishList.length)];
            lanternGroup.userData = {
                wish: randomWish.wish, imgUrl: randomWish.imgUrl,
                speedY: Math.random() * 0.03 + 0.02, frequency: Math.random() * 0.02 + 0.01, offset: Math.random() * Math.PI * 2
            };
            
            lanternGroup.position.set((Math.random() - 0.5) * 120, isInitial ? Math.random() * 90 - 10 : -20, (Math.random() - 0.5) * 120);
            scene.add(lanternGroup);
            lanterns.push(lanternGroup);
        }

        for(let i=0; i<lanternCount; i++) createLantern(true);

        // ĐOẠN CODE TƯƠNG TÁC BẤM CHẠM ĐÈN LỒNG
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const wishModal = document.getElementById("wishModal");
        const wishText = document.getElementById("wishText");
        const wishImage = document.getElementById("wishImage");

        function handleSelection(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const clickableObjects = [];
lanterns.forEach(l => l.children.forEach(c => { if(c.isMesh) { c.userData.parentGroup = l; clickableObjects.push(c); } }));
const intersects = raycaster.intersectObjects(clickableObjects);
if (intersects.length > 0) {
const targetGroup = intersects.object.userData.parentGroup;
if(targetGroup && targetGroup.userData.wish) {
controls.enabled = false;
wishText.textContent = ${targetGroup.userData.wish};
wishImage.src = targetGroup.userData.imgUrl;
wishModal.classList.add("active");
}
}
}
window.addEventListener("pointerdown", (e) => {
if (e.target.tagName === 'BUTTON' || e.target.closest('#wishModal')) return;
handleSelection(e.clientX, e.clientY);
});
window.addEventListener("touchstart", (e) => {
if (e.target.tagName === 'BUTTON' || e.target.closest('#wishModal')) return;
if(e.touches.length > 0) handleSelection(e.touches.clientX, e.touches.clientY);
}, { passive: true });
document.getElementById("closeWishBtn").addEventListener("click", () => { wishModal.classList.remove("active"); controls.enabled = true; });
// Xử lý nhạc nền
const bgm = document.getElementById("bgm");
const audioBtn = document.getElementById("audio-btn");
let isPlaying = false;
audioBtn.addEventListener("click", () => {
if (isPlaying) { bgm.pause(); audioBtn.innerHTML = ' Bật Nhạc'; }
else { bgm.play().catch(e => console.log(e)); audioBtn.innerHTML = ' Tắt Nhạc'; }
isPlaying = !isPlaying;
});
// Vòng lặp chuyển động
const clock = new THREE.Clock();
function animate() {
requestAnimationFrame(animate);
const time = clock.getElapsedTime();
islandGroup.rotation.y = time * 0.05;
islandGroup.position.y = Math.sin(time * 0.8) * 0.4;
const posAttr = fireflies.geometry.attributes.position;
for(let i=0; i<particleCount; i++) {
posAttr.array[i3+1] += speeds[i].y;
if(posAttr.array[i3+1] > 35) posAttr.array[i*3+1] = -5;
}
posAttr.needsUpdate = true;
for(let i = lanterns.length - 1; i >= 0; i--) {
const l = lanterns[i];
l.position.y += l.userData.speedY;
l.position.x += Math.sin(time * l.userData.frequency + l.userData.offset) * 0.02;
if(l.position.y > 75) { scene.remove(l); lanterns.splice(i, 1); createLantern(false); }
}
controls.update();
renderer.render(scene, camera);
}
window.addEventListener("resize", () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
animate();
