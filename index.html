<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Thu 3D - Vũ Trụ Đêm Rằm</title>
    <!-- Nhúng thư viện icon trực tuyến -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0c061a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .music-btn-container {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 10;
        }
        .music-control {
            background: rgba(255, 215, 0, 0.15);
            border: 1.5px solid #ffd700;
            color: #ffd700;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
        .music-control:hover {
            background: #ffd700;
            color: #0c061a;
            box-shadow: 0 0 25px #ffd700;
        }
        .bottom-instruction {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.65);
            font-size: 14px;
            letter-spacing: 0.5px;
            z-index: 5;
            pointer-events: none;
            text-align: center;
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .wish-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(4px);
        }
        .wish-modal.active {
            display: flex;
            opacity: 1;
        }
        .wish-card {
            width: 90%;
            max-width: 340px;
            background: linear-gradient(135deg, #24112e 0%, #12071a 100%);
            border: 2px solid rgba(255, 215, 0, 0.6);
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            color: white;
            position: relative;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.25);
            transform: scale(0.85);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .wish-modal.active .wish-card {
            transform: scale(1);
        }
        .card-title {
            font-family: 'Georgia', serif;
            font-style: italic;
            color: #ffe082;
            font-size: 20px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: rgba(255, 215, 0, 0.7);
            font-size: 22px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-btn:hover { color: #ffffff; }
        .card-body-content {
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .card-body-content img {
            width: 100% !important;
            max-width: 120px !important;
            height: auto !important;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        .card-body-content p {
            font-size: 14px;
            line-height: 1.6;
            color: #fff8e1;
            margin: 0;
            font-style: italic;
        }
        .card-footer-text {
            margin-top: 15px;
            font-size: 11px;
            letter-spacing: 2px;
            color: rgba(255, 215, 0, 0.5);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="music-btn-container">
        <button class="music-control" id="audio-btn">
            <i class="fas fa-music" id="music-icon"></i>
        </button>
    </div>

    <div class="bottom-instruction">Chạm vào lồng đèn để xem lời chúc Trung Thu</div>

    <div id="webgl-container"></div>

    <div class="wish-modal" id="wishModal">
        <div class="wish-card">
            <button class="close-btn" id="closeWishBtn">&times;</button>
            <div class="card-title">Gửi người thương</div>
            <div class="card-body-content">
                <img src="" id="wishImage" alt="Kỷ niệm">
                <p id="wishText"></p>
            </div>
            <div class="card-footer-text">✦ TRUNG THU AN LÀNH ✦</div>
        </div>
    </div>

    <audio id="bgm" src="assets/1.mp3" loop></audio>

    <!-- NHÚNG LINK THƯ VIỆN CHUẨN XÁC 100% ĐỂ RENDERING HÌNH KHỐI -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    
    <script>
        const container = document.getElementById("webgl-container");
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0e061a, 0.007);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 9, 32);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 5, 0);
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.minDistance = 15;
        controls.maxDistance = 80;

        const ambientLight = new THREE.AmbientLight(0x2d1f47, 1.5); 
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffdfb0, 1.6); 
        dirLight.position.set(-60, 70, -100);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        const moonGroup = new THREE.Group();
        moonGroup.position.set(-35, 42, -130);
        
        const moonGeo = new THREE.SphereGeometry(24, 32, 32);
        const moonMat = new THREE.MeshBasicMaterial({ color: 0x8a869a }); 
        const moonMesh = new THREE.Mesh(moonGeo, moonMat);
        moonGroup.add(moonMesh);

        const glowGeo = new THREE.SphereGeometry(26, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({ color: 0xfffdd0, transparent: true, opacity: 0.08, side: THREE.BackSide });
        const glowMesh = new THREE.Mesh(glowGeo, glowMat);
        moonGroup.add(glowMesh);
        scene.add(moonGroup);

        const wishList = [
          { wish: "Cầu chúc cho mọi nguyện ước của người thương đêm nay sẽ trở thành hiện thực.", imgUrl: "./assets/1.jpg" },
          { wish: "Chúc người thương và gia đình một mùa Trung Thu đoàn viên, tràn ngập niềm vui và hạnh phúc!", imgUrl: "./assets/2.jpg" },
          { wish: "Trăng tròn ấm áp, chúc tình cảm của chúng ta mãi luôn bền chặt và ngọt ngào.", imgUrl: "./assets/3.jpg" },
          { wish: "Chúc người thương luôn giữ được sự hồn nhiên, yêu đời và rạng rỡ như ánh trăng rằm.", imgUrl: "./assets/1.jpg" }
        ];

        const islandGroup = new THREE.Group();
        scene.add(islandGroup);

        const islandGeo = new THREE.CylinderGeometry(15, 2, 11, 6, 4);
        const pos = islandGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            let y = pos.getY(i);
            if (y < 5) { 
                pos.setX(i, pos.getX(i) + (Math.random() - 0.5) * 3);
                pos.setZ(i, pos.getZ(i) + (Math.random() - 0.5) * 3);
            }
        }
        islandGeo.computeVertexNormals();

        const islandMat = new THREE.MeshStandardMaterial({ color: 0x22152b, roughness: 0.75, metalness: 0.1 });
        const island = new THREE.Mesh(islandGeo, islandMat);
        island.position.y = 0;
        island.receiveShadow = true;
        island.castShadow = true;
        islandGroup.add(island);

        const grassGeo = new THREE.CylinderGeometry(15.2, 15.2, 0.2, 16);
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x33143b, roughness: 0.7 });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.position.y = 5.5;
        grass.receiveShadow = true;
        islandGroup.add(grass);

        const treeGroup = new THREE.Group();
        treeGroup.position.set(0, 5.5, 0);

        const trunkGeo = new THREE.CylinderGeometry(0.4, 0.8, 5.5, 8);
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x140a14, roughness: 0.9 });
const trunk = new THREE.Mesh(trunkGeo, trunkMat);
trunk.position.y = 2.75;
trunk.castShadow = true;
treeGroup.add(trunk);
const leavesGroup = new THREE.Group();
leavesGroup.position.y = 5.5;
const leafGeo = new THREE.SphereGeometry(3.2, 8, 8);
const leafMat = new THREE.MeshBasicMaterial({ color: 0xff99b4, transparent: true, opacity: 0.45 });
for (let i = 0; i < 55; i++) {
const mesh = new THREE.Mesh(leafGeo, leafMat);
mesh.position.set(
(Math.random() - 0.5) * 11,
(Math.random() - 0.5) * 5 + 2,
(Math.random() - 0.5) * 11
);
const s = Math.random() * 0.4 + 0.8;
mesh.scale.set(s, s, s);
leavesGroup.add(mesh);
}
treeGroup.add(leavesGroup);
islandGroup.add(treeGroup);
const rabbitGroup = new THREE.Group();
rabbitGroup.position.set(-1.5, 5.7, 3);
rabbitGroup.scale.set(0.35, 0.35, 0.35);
const rabbitBody = new THREE.Mesh(new THREE.SphereGeometry(1.4, 16, 16), new THREE.MeshBasicMaterial({ color: 0xdddddd }));
rabbitBody.scale.set(1, 1.2, 1);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.75, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
head.position.set(0, 1.5, 0.4);
const earGeo = new THREE.CylinderGeometry(0.1, 0.16, 1.3, 8);
const earMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const earL = new THREE.Mesh(earGeo, earMat); earL.position.set(-0.2, 2.4, 0.2);
const earR = new THREE.Mesh(earGeo, earMat); earR.position.set(0.2, 2.4, 0.2);
rabbitGroup.add(rabbitBody, head, earL, earR);
islandGroup.add(rabbitGroup);
const particleCount = isMobile ? 50 : 130;
const particleGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const speeds = [];
for(let i=0; i<particleCount; i++) {
positions[i3] = (Math.random() - 0.5) * 70;
positions[i3+1] = Math.random() * 35 - 3;
positions[i*3+2] = (Math.random() - 0.5) * 70;
speeds.push({ x: (Math.random() - 0.5) * 0.04, y: Math.random() * 0.03 + 0.01, z: (Math.random() - 0.5) * 0.04 });
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const fireflies = new THREE.Points(particleGeo, new THREE.PointsMaterial({ color: 0xffd700, size: isMobile ? 0.5 : 0.35, transparent: true, opacity: 0.85 }));
scene.add(fireflies);
const lanterns = [];
const lanternCount = isMobile ? 18 : 38;
function createLantern(isInitial = false) {
const lanternGroup = new THREE.Group();
const bodyMesh = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 0.85, 2.3, 8), new THREE.MeshBasicMaterial({ color: 0xff9422 }));
bodyMesh.name = "click_lantern_part";
lanternGroup.add(bodyMesh);
const capTop = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.18, 8), new THREE.MeshBasicMaterial({ color: 0xb71c1c }));
capTop.position.y = 1.15;
capTop.name = "click_lantern_part";
const capBottom = capTop.clone();
capBottom.position.y = -1.15;
capBottom.name = "click_lantern_part";
lanternGroup.add(capTop, capBottom);
const randomWish = wishList[Math.floor(Math.random() * wishList.length)];
lanternGroup.userData = {
wish: randomWish.wish, imgUrl: randomWish.imgUrl,
speedY: Math.random() * 0.025 + 0.015, frequency: Math.random() * 0.02 + 0.01, offset: Math.random() * Math.PI * 2
};
lanternGroup.position.set((Math.random() - 0.5) * 120, isInitial ? Math.random() * 85 - 10 : -25, (Math.random() - 0.5) * 120);
scene.add(lanternGroup);
lanterns.push(lanternGroup);
}
for(let i=0; i<lanternCount; i++) createLantern(true);
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const wishModal = document.getElementById("wishModal");
const wishText = document.getElementById("wishText");
const wishImage = document.getElementById("wishImage");
function handleSelection(clientX, clientY) {
mouse.x = (clientX / window.innerWidth) * 2 - 1;
mouse.y = -(clientY / window.innerHeight) * 2 + 1;
raycaster.setFromCamera(mouse, camera);
const clickableParts = [];
lanterns.forEach(l => {
l.children.forEach(c => {
if (c.name === "click_lantern_part") {
c.userData.rootGroup = l;
clickableParts.push(c);
}
});
});
const intersects = raycaster.intersectObjects(clickableParts);
if (intersects.length > 0) {
const targetRoot = intersects.object.userData.rootGroup;
if(targetRoot && targetRoot.userData.wish) {
controls.enabled = false;
wishText.textContent = ${targetRoot.userData.wish};
if(targetRoot.userData.imgUrl) {
wishImage.src = targetRoot.userData.imgUrl;
wishImage.style.display = "block";
} else {
wishImage.style.display = "none";
}
wishModal.style.display = "flex";
setTimeout(() => { wishModal.classList.add("active"); }, 10);
}
}
}
window.addEventListener("pointerdown", (e) => {
if (e.target.tagName === 'BUTTON' || e.target.closest('#wishModal')) return;
handleSelection(e.clientX, e.clientY);
});
window.addEventListener("touchstart", (e) => {
if (e.target.tagName === 'BUTTON' || e.target.closest('#wishModal')) return;
if(e.touches.length > 0) handleSelection(e.touches.clientX, e.touches.clientY);
}, { passive: true });
document.getElementById("closeWishBtn").addEventListener("click", () => {
wishModal.classList.remove("active");
setTimeout(() => { wishModal.style.display = "none"; controls.enabled = true; }, 400);
});
const bgm = document.getElementById("bgm");
const audioBtn = document.getElementById("audio-btn");
const musicIcon = document.getElementById("music-icon");
let isPlaying = false;
audioBtn.addEventListener("click", () => {
if (isPlaying) {
bgm.pause();
musicIcon.className = "fas fa-music";
audioBtn.style.background = "rgba(255, 215, 0, 0.15)";
} else {
bgm.play().catch(e => console.log(e));
musicIcon.className = "fas fa-pause";
audioBtn.style.background = "#ffd700";
audioBtn.style.color = "#0c061a";
}
isPlaying = !isPlaying;
});
const clock = new THREE.Clock();
function animate() {
requestAnimationFrame(animate);
const time = clock.getElapsedTime();
islandGroup.rotation.y = time * 0.035;
islandGroup.position.y = Math.sin(time * 0.8) * 0.25;
leavesGroup.children.forEach((child, index) => {
child.position.y += Math.sin(time * 1.1 + index) * 0.003;
});
rabbitGroup.position.y = 5.7 + Math.abs(Math.sin(time * 2.6)) * 0.35;
const posAttr = fireflies.geometry.attributes.position;
for(let i=0; i<particleCount; i++) {
posAttr.array[i3] += speeds[i].x;
posAttr.array[i3+1] += speeds[i].y;
posAttr.array[i3+2] += speeds[i].z;
if(posAttr.array[i3+1] > 32) {
posAttr.array[i3+1] = -3;
posAttr.array[i3] = (Math.random() - 0.5) * 70;
posAttr.array[i*3+2] = (Math.random() - 0.5) * 70;
}
}
posAttr.needsUpdate = true;
for(let i = lanterns.length - 1; i >= 0; i--) {
const l = lanterns[i];
l.position.y += l.userData.speedY;
l.position.x += Math.sin(time * l.userData.frequency + l.userData.offset) * 0.018;
if(l.position.y > 75) { scene.remove(l); lanterns.splice(i, 1); createLantern(false); }
}
controls.update();
renderer.render(scene, camera);
}
window.addEventListener("resize", () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
animate();
