<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Thu 3D - Vũ Trụ Đêm Rằm</title>
    <!-- Nhúng thư viện icon trực tuyến -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05050a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .top-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }
        .control-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #ffd700;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .control-btn:hover {
            background: #ffd700;
            color: #05050a;
            box-shadow: 0 0 20px #ffd700;
        }
        .brand-title {
            position: absolute;
            bottom: 40px;
            left: 40px;
            color: #ffffff;
            z-index: 5;
            pointer-events: none;
        }
        .brand-title h1 {
            font-size: 48px;
            margin: 0 0 5px 0;
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
        }
        .brand-title p {
            font-size: 18px;
            margin: 0;
            opacity: 0.7;
        }
        /* KHUNG THIỆP CHÚC MỪNG CO GIÃN NHỎ GỌN XINH XẮN */
        .wish-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .wish-modal.active { display: flex; }
        .wish-card {
            width: 90%;
            max-width: 320px;
            background: #150f2e;
            border: 2px solid #ffd700;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: white;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: #ffd700;
            font-size: 24px;
            cursor: pointer;
        }
        .card-body img {
            width: 100% !important;
            max-width: 180px !important;
            height: auto !important;
            border-radius: 8px;
            margin: 0 auto 15px auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="brand-title">
        <h1>Trung thu</h1>
        <p>Tết trung thu đoàn viên</p>
    </div>

    <div class="top-bar">
        <button class="control-btn" id="audio-btn"><i class="fas fa-music"></i> Bật Nhạc</button>
    </div>

    <div id="webgl-container"></div>

    <div class="wish-modal" id="wishModal">
        <div class="wish-card">
            <button class="close-btn" id="closeWishBtn">&times;</button>
            <div class="card-body">
                <img src="" id="wishImage" alt="Hình ảnh Trung Thu">
                <p id="wishText"></p>
            </div>
        </div>
    </div>

    <!-- Gọi file âm thanh nền -->
    <audio id="bgm" src="assets/1.mp3" loop></audio>

    <!-- Các thư viện đồ họa chạy trực tuyến chính hãng của Three.js -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    
    <script>
        // ====== TOÀN BỘ LOGIC ĐỒ HỌA GỐC ĐÃ ĐƯỢC TÍNH TOÁN LẠI TỌA ĐỘ ======
        const container = document.getElementById("webgl-container");
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05050a, 0.005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        // THAY ĐỔI: Kéo camera lại gần trục Z=28 để hòn đảo hiện lên to lớn, rõ nét y hệt ảnh mẫu
        camera.position.set(0, 8, 28);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 5, 0);
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        // HỆ THỐNG ÁNH SÁNG RỰC RỠ ĐỔ KHỐI
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.4); 
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.5); 
        dirLight.position.set(40, 60, 40);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // MẶT TRĂNG XÁM BẠC TO LỚN PHÍA SAU MẪU GỐC
        const moonGeo = new THREE.SphereGeometry(28, 32, 32);
        const moonMat = new THREE.MeshBasicMaterial({ color: 0x8a8a9a }); 
        const moon = new THREE.Mesh(moonGeo, moonMat);
        moon.position.set(40, 45, -150);
        scene.add(moon);

        // DANH SÁCH LỜI CHÚC TRUNG THU & ĐỔI ẢNH CỦA BẠN
        const wishList = [
          { wish: "Cầu chúc cho mọi nguyện ước của người thương đêm nay sẽ trở thành hiện thực.", imgUrl: "./assets/1.jpg" },
          { wish: "Chúc người thương và gia đình một mùa Trung Thu đoàn viên, tràn ngập niềm vui và hạnh phúc!", imgUrl: "./assets/2.jpg" },
          { wish: "Trăng tròn ấm áp, chúc tình cảm của chúng ta mãi luôn bền chặt và ngọt ngào.", imgUrl: "./assets/3.jpg" },
          { wish: "Chúc người thương luôn giữ được sự hồn nhiên, yêu đời và rạng rỡ như ánh trăng rằm.", imgUrl: "./assets/1.jpg" }
        ];

        // PHỤC DỰNG ĐẢO ĐÁ GỒ GHỀ NỔI KHỐI TỰ NHIÊN
        const islandGroup = new THREE.Group();
        scene.add(islandGroup);

        const islandGeo = new THREE.CylinderGeometry(16, 2, 12, 6, 4);
        const pos = islandGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            let y = pos.getY(i);
            if (y < 5) { 
                pos.setX(i, pos.getX(i) + (Math.random() - 0.5) * 2.5);
                pos.setZ(i, pos.getZ(i) + (Math.random() - 0.5) * 2.5);
            }
        }
        islandGeo.computeVertexNormals();

        const islandMat = new THREE.MeshStandardMaterial({ color: 0x3a283e, roughness: 0.7, metalness: 0.1 });
        const island = new THREE.Mesh(islandGeo, islandMat);
        island.position.y = 0;
        island.receiveShadow = true;
        island.castShadow = true;
        islandGroup.add(island);

        // Thảm cỏ bề mặt đảo
        const grassGeo = new THREE.CylinderGeometry(16.2, 16.2, 0.2, 16);
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x4a235a, roughness: 0.6 });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.position.y = 6;
        grass.receiveShadow = true;
        islandGroup.add(grass);

        // CÂY HOA ANH ĐÀO PHÁT SÁNG LUNG LINH
        const treeGroup = new THREE.Group();
        treeGroup.position.set(0, 6, 0);

        const trunkGeo = new THREE.CylinderGeometry(0.5, 0.9, 6, 8);
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x1a0f1a, roughness: 0.9 });
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = 3;
        trunk.castShadow = true;
        treeGroup.add(trunk);

        const leavesGroup = new THREE.Group();
        leavesGroup.position.y = 6;

        const leafGeo = new THREE.SphereGeometry(3.5, 8, 8);
        const leafMat = new THREE.MeshBasicMaterial({ color: 0xffa0b4, transparent: true, opacity: 0.5 });

        for (let i = 0; i < 50; i++) {
            const mesh = new THREE.Mesh(leafGeo, leafMat);
            mesh.position.set(
                (Math.random() - 0.5) * 12,
                (Math.random() - 0.5) * 5 + 2,
                (Math.random() - 0.5) * 12
            );
            const s = Math.random() * 0.5 + 0.7;
            mesh.scale.set(s, s, s);
            leavesGroup.add(mesh);
        }
        treeGroup.add(leavesGroup);
        islandGroup.add(treeGroup);

        // THỎ NGỌC TRÊN ĐẢO ĐÁ
        const rabbitGroup = new THREE.Group();
        rabbitGroup.position.set(-2, 6.2, 3);
        rabbitGroup.scale.set(0.4, 0.4, 0.4);

        const rabbitBody = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), new THREE.MeshBasicMaterial({ color: 0xeeeeee }));
        rabbitBody.scale.set(1, 1.2, 1);
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        head.position.set(0, 1.6, 0.4);

        const earGeo = new THREE.CylinderGeometry(0.12, 0.18, 1.4, 8);
        const earMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const earL = new THREE.Mesh(earGeo, earMat); earL.position.set(-0.25, 2.5, 0.2);
